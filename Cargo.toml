[workspace]
members = [
  "crates/arpg-core",
  "crates/arpg-protocol",
  "crates/arpg-game-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
arpg-core = { path = "crates/arpg-core" }
arpg-protocol = { path = "crates/arpg-protocol" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "81cad7a4d80849d13c37120a411d3a053c46f9a0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
