[workspace]
members = [
  "crates/arpg-core",
  "crates/arpg-protocol",
  "crates/arpg-game-server",
  "crates/arpg-web-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
arpg-core = { path = "crates/arpg-core" }
arpg-protocol = { path = "crates/arpg-protocol" }
game-server = { git = "https://github.com/moritzbrantner/game-server.git", rev = "f7efa8fc6d61abffdbc55afaa05d6fde48c05da1" }
physics-engine = { git = "https://github.com/moritzbrantner/physics-engine.git", rev = "2108a634e304cfc8e04d212949943977d74993ab" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
wasm-bindgen = "=0.2.128"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
