name: Validate

on:
  push:
  pull_request:

jobs:
  rust:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@main
    with:
      bun_version: ""
      node_version: ""
      install_command: ""
      cache_bun: false
      cache_cargo: true
      format_command: cargo fmt --all -- --check
      lint_command: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      test_command: cargo test --locked --workspace --all-features
      artifact_paths: ""

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check browser formatting and lint
        working-directory: web
        run: bun run format:check && bun run lint
      - name: Test browser contracts
        working-directory: web
        run: bun run test
      - name: Install browser test runtime
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Build browser MVP
        working-directory: web
        run: bun run setup
      - name: Bundle browser MVP
        working-directory: web
        run: bun run build
      - name: Execute compiled WASM gameplay controls
        working-directory: web
        run: bun run test:physics-wasm
      - name: Verify browser workflows
        working-directory: web
        run: bun run test:browser
      - name: Verify build kept lockfiles unchanged
        run: git diff --exit-code -- Cargo.lock web/bun.lock
