name: Validate

on:
  push:
  pull_request:

jobs:
  rust:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@28a77d034ce18595e5f058f81e8063ea67d23bd9
    with:
      bun_version: ""
      node_version: ""
      install_command: ""
      cache_bun: false
      cache_cargo: true
      format_command: cargo fmt --all -- --check
      lint_command: cargo clippy --workspace --all-targets --all-features -- -D warnings
      test_command: cargo test --workspace --all-features
      artifact_paths: ""

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Install web dependencies
        working-directory: web
        run: bun install
      - name: Build browser MVP
        working-directory: web
        run: bun run build
      - name: Capture generated lockfiles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-lockfiles
          path: |
            Cargo.lock
            web/bun.lock
          if-no-files-found: error
      - name: Commit generated lockfiles on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/foundation-mvp'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock web/bun.lock
          if git diff --cached --quiet; then
            echo "Dependency lockfiles already match."
            exit 0
          fi
          git commit -m "Lock ARPG dependencies"
          git push origin HEAD:feature/foundation-mvp
