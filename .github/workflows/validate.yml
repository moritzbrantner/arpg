name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/validate-repo.yml@28a77d034ce18595e5f058f81e8063ea67d23bd9
    with:
      bun_version: ""
      node_version: ""
      install_command: ""
      cache_bun: false
      cache_cargo: true
      format_command: cargo fmt --all -- --check
      lint_command: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      test_command: cargo test --locked --workspace --all-features
      artifact_paths: ""

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Test browser input helpers
        working-directory: web
        run: bun run test
      - name: Build browser MVP
        working-directory: web
        run: bun run build
      - name: Verify build kept lockfiles unchanged
        run: git diff --exit-code -- Cargo.lock web/bun.lock
