name: pages

on:
  pull_request:
    paths:
      - "web/**"
      - "crates/arpg-core/**"
      - "crates/arpg-protocol/**"
      - "crates/arpg-web-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/arpg-core/**"
      - "crates/arpg-protocol/**"
      - "crates/arpg-web-wasm/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Install browser dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build playable MVP
        working-directory: web
        run: bun run setup
      - name: Bundle playable MVP
        working-directory: web
        run: bun run build
      - name: Verify build kept lockfiles unchanged
        run: git diff --exit-code -- Cargo.lock web/bun.lock
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
